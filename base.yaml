# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
 
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.metadb"
  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  asn: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
# 匹配进程 always/strict/off
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    
# 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    'geosite:geolocation-!cn':
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query


proxy-providers:

  masque:
    type: http
    url: "http://192.168.1.50/jiedian.yaml"
    interval: 10800
    path: ./providers/masque.yaml



proxies:[]

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - DIRECT
    - 所有-手动
    - 所有-自动
    - WARP-故转
    - masque-自动
    - WireGuard-故转
    - 亚洲-自动
    - 欧洲-自动
    - 美洲-自动
    - REJECT

proxy-groups:

  # 业务分流组
  
  - {name: 🎯 全球直连, <<: *default}
  - {name: 🛑 全球拦截, <<: *default}
  - {name: 🍃 应用净化, <<: *default}
  - {name: Ⓜ️ 微软服务, <<: *default}
  - {name: 🍎 苹果服务, <<: *default}
  - {name: 🌍 国外媒体, <<: *default}
  - {name: 🚀 节点选择, <<: *default}
  - {name: 📹 油管视频, <<: *default}
  - {name: 🎥 奈飞视频, <<: *default}
  - {name: 📲 电报信息, <<: *default}
  - {name: 🤖 AI服务, <<: *default}
  - {name: 📢 谷歌FCM, <<: *default}
  - {name: 🐟 漏网之鱼, <<: *default}


  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(DIRECT|REJECT)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(DIRECT|REJECT)).)*$"

  # WARP组
  - name: WARP-故转
    type: fallback
    include-all: true
    tolerance: 50
    interval: 300
    lazy: false
    filter: "^(WARP|WARP-HTTP)$"

    # WIREGUARDD组
  - name: WireGuard-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - WireGuard-手动
      - WireGuard-自动
  - name: WireGuard-手动
    type: select
    include-all: true
    filter: "(?=.*(#)).*$"
  - name: WireGuard-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(#)).*$"

  # masque组
  - name: masque-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: '^(?!.*(亚洲|欧洲|美洲)).*(1-|2-|官方).*'
  
  # 亚洲组
  - name: 亚洲-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(亚洲)).*$"

  # 欧洲组
  - name: 欧洲-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(欧洲)).*$"

  # 美洲组
  - name: 美洲-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(美洲)).*$"

